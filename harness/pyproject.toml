[project]
name = "harness"
version = "0.1.0"
description = "Arnés de gobernanza agéntica — Self-Evaluating Trading Agent"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "weasyprint>=69.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
