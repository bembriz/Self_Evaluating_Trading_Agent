[project]
name = "self-evaluating-trading-agent"
version = "0.1.0"
description = "Self-Evaluating Trading Agent — ETH/USDT spot, long-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "fastembed>=0.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "pytest-asyncio>=1.4.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/application", "src/infrastructure", "src/interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: unit tests (dominio puro)",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "real_dataset: requires the official BYBIT_ETHBTC_V001 CSV (gitignored, absent in CI)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = [
    "tests/test_market_data_service\\.py$",
    "tests/test_historical_service\\.py$",
]
