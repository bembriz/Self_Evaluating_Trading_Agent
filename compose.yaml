services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_agent}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-45d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-operator}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-seta}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  paper-runner:
    build: .
    # Imagen etiquetada para fijar el artefacto construido una sola vez en el APPLY
    # (build → capturar digest → inyectar identidad → up --no-build).
    image: self-evaluating-trading-agent-paper-runner:${APP_VERSION:-0.2.0}
    command: ["python", "-m", "main", "paper-runner", "--symbols", "ETHUSDT", "--timeframe", "15m"]
    restart: unless-stopped
    environment:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-trading_agent}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      PAPER_DECISION_SOURCE: baseline
      PAPER_TIMEFRAME: 15m
      PAPER_REPORT_INTERVAL_HOURS: ${PAPER_REPORT_INTERVAL_HOURS:-6}
      # Ventana de certificación: 30d + margen ⇒ 45 (0 = sin límite). Evita el
      # default peligroso de .env.example (7d), insuficiente para certificar.
      PAPER_MAX_RUNTIME_DAYS: ${PAPER_MAX_RUNTIME_DAYS:-45}
      # Sesión explícita y versionada (no reutiliza la sesión 0.1.3).
      PAPER_SESSION_ID: ${PAPER_SESSION_ID:-paper-baseline-15m-ethusdt-0.2.0}
      PAPER_REPORT_DIR: reports/paper
      PAPER_CERTIFICATION_STATE_PATH: /app/certification/certification-state.json
      # Identidad de artefacto: fail-fast, SIEMPRE inyectada en el APPLY.
      # GIT_COMMIT = FINAL_DEPLOY_SHA (SHA integrado tras el merge); 8188e85… es
      # solo la base histórica de 16c, NO la identidad final de deployment.
      # DOCKER_IMAGE_DIGEST = digest real de la imagen construida en el APPLY.
      GIT_COMMIT: "${GIT_COMMIT:?GIT_COMMIT is required - inject final deployed SHA}"
      DOCKER_IMAGE_DIGEST: "${DOCKER_IMAGE_DIGEST:?DOCKER_IMAGE_DIGEST is required - inject actual deployed image digest}"
      # Evidencia de safeguard drills: ruta persistente host-backed (bind mount).
      PAPER_SAFEGUARD_EVIDENCE_PATH: /app/safeguard/safeguard-evidence.json
    volumes:
      - ./reports:/app/reports:rw
      - ./certification:/app/certification:rw
      - ./safeguard:/app/safeguard:rw
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
