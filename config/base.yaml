# Configuración base (defaults seguros). Se sobrescribe con .env (secrets) y,
# en fases posteriores, con config/<modo>.yaml según TRADING_MODE.

environment: base
app_name: self-evaluating-trading-agent
trading_mode: backtest
live_trading_enabled: false

postgres_host: localhost
postgres_port: 5433
postgres_db: trading_agent
postgres_user: trading
postgres_password: ""

bybit_base_url: https://api.bybit.com
bybit_request_timeout: 10.0
dataset_dir: datasets

bybit_ws_url: wss://stream.bybit.com/v5/public/spot
bybit_orderbook_depth: 50
stale_timeout_seconds: 10.0
feature_window_seconds: 5

llm_provider: deepseek
llm_model: deepseek-v4-flash
llm_base_url: https://api.deepseek.com
llm_api_key: ""
llm_timeout: 30.0
llm_temperature: 0.0
llm_price_input_mtok: 0.27
llm_price_output_mtok: 1.10
llm_experiment_budget_usd: 5.0
llm_monthly_budget_usd: 50.0
prompts_dir: prompts
