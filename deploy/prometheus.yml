scrape_configs:
  - job_name: seta
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      # Solo el runner de certificación. `host.docker.internal:8000` (API) queda
      # fuera: no hay servicio API desplegado y ese nombre no resuelve en Linux
      # sin `extra_hosts: ["host.docker.internal:host-gateway"]`; se re-añadirá
      # cuando exista el servicio API con su extra_hosts.
      - targets: ["paper-runner:9090"]
